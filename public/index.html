<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Judul tab browser -->
  <title>Coffee Nusantara - AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: transparent;
      /* PENTING: Agar iframe terlihat rapi */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      /* overflow: hidden; */
      /* Mencegah scroll double */
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 420px;
      height: 620px;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
    }

    #header {
      padding: 14px 18px;
      border-bottom: 1px solid #e8ddd4;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #4A2C2A;
    }

    #avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #7B4F3A;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    /* Nama assistant di header */
    #header-info p {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    #header-info span {
      font-size: 12px;
      color: #c8a882;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Indikator status online (titik hijau) */
    #status-dot {
      width: 7px;
      height: 7px;
      background: #4CAF50;
      border-radius: 50%;
      display: inline-block;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #faf6f2;

      /* SOLUSI SCROLLBAR: Untuk Chrome, Safari, Edge */
      scrollbar-width: thin;
      /* Untuk Firefox */
    }

    /* Mempercantik tampilan scrollbar agar tipis dan estetik */
    #messages::-webkit-scrollbar {
      width: 5px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: #d1b8a0;
      /* Warna cokelat muda senada tema kopi */
      border-radius: 10px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }

    .msg.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Bubble pesan dari user (kanan, cokelat tua) */
    .msg.user .bubble {
      background: #4A2C2A;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* Bubble pesan dari bot (kiri, putih dengan border) */
    .msg.bot .bubble {
      background: #fff;
      border: 1px solid #e8ddd4;
      color: #2c1a10;
      border-bottom-left-radius: 4px;
    }

    /* Link di dalam bubble bot (untuk nomor WA dll) */
    .msg.bot .bubble a {
      color: #25D366;
      text-decoration: underline;
      font-weight: 600;
    }

    .msg-time {
      font-size: 11px;
      color: #a08070;
      margin-top: 4px;
      padding: 0 4px;
    }

    /* Animasi typing indicator (3 titik bergerak) */
    #typing {
      display: none;
      align-self: flex-start;
    }

    #typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 16px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a08070;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0)
      }

      30% {
        transform: translateY(-6px)
      }
    }

    /* Area chips (tombol pertanyaan cepat) */
    #chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 16px;
      background: #faf6f2;
      border-top: 1px solid #e8ddd4;
    }

    .chip {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #c8a882;
      background: #fff;
      color: #7B4F3A;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .chip:hover {
      background: #4A2C2A;
      color: #fff;
      border-color: #4A2C2A;
    }

    #input-area {
      padding: 12px 14px;
      border-top: 1px solid #e8ddd4;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #fff;
    }

    #msg-input {
      flex: 1;
      resize: none;
      border: 1px solid #e8ddd4;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 14px;
      font-family: Arial, sans-serif;
      background: #faf6f2;
      color: #2c1a10;
      outline: none;
      max-height: 100px;
      line-height: 1.4;
    }

    #msg-input:focus {
      border-color: #7B4F3A;
    }

    /* Tombol kirim pesan */
    #send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #4A2C2A;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    #send-btn:hover {
      background: #7B4F3A;
    }

    #send-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #send-btn:disabled {
      background: #e8ddd4;
      cursor: not-allowed;
    }

    #send-btn:disabled svg {
      stroke: #a08070;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- Header: nama brand dan status online -->
    <div id="header">
      <div id="avatar">☕</div>
      <div id="header-info">
        <!-- Update: nama brand disesuaikan -->
        <p>CS Coffee Nusantara</p>
        <span><span id="status-dot"></span> Online</span>
      </div>
    </div>

    <div id="messages">
      <!-- Pesan sambutan awal dari bot, disesuaikan dengan brand Coffee Nusantara -->
      <div class="msg bot">
        <div class="bubble">Halo! Selamat datang di Coffee Nusantara. Ada yang bisa saya bantu?
        </div>
        <span class="msg-time">Just now</span>
      </div>
    </div>

    <!-- Typing indicator: muncul saat bot sedang memproses jawaban -->
    <div id="typing" class="msg bot">
      <div class="bubble">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- Chips: pertanyaan cepat yang relevan dengan produk Coffee Nusantara -->
    <div id="chips">
      <div class="chip" onclick="sendChip(this)">Produk apa saja?</div>
      <div class="chip" onclick="sendChip(this)">Cara order</div>
      <div class="chip" onclick="sendChip(this)">Jam operasional</div>
      <div class="chip" onclick="sendChip(this)">Produk halal?</div>
      <div class="chip" onclick="sendChip(this)">Info pengiriman</div>
    </div>

    <div id="input-area">
      <textarea id="msg-input" placeholder="Ketik pesan..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()" aria-label="Kirim">
        <svg viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    // Mengambil base URL backend dari origin halaman ini (relatif)
    const BACKEND = window.location.origin;

    // Referensi ke elemen-elemen DOM yang sering diakses
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const typingEl = document.getElementById('typing');
    const chipsEl = document.getElementById('chips');

    // Menyimpan thread_id aktif untuk sesi percakapan ini
    let threadId = null;

    // Flag untuk mencegah pengiriman pesan ganda saat bot masih merespons
    let isWaiting = false;

    // Mengembalikan waktu sekarang dalam format HH:MM (Indonesia)
    function getTime() {
      return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    // Membuat elemen bubble kosong untuk pesan bot, lalu menambahkannya ke area chat
    // Mengembalikan referensi ke elemen bubble agar teks bisa diisi secara streaming
    function createBotBubble() {
      const div = document.createElement('div');
      div.className = 'msg bot';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const time = document.createElement('span');
      time.className = 'msg-time';
      time.textContent = getTime();
      div.appendChild(bubble);
      div.appendChild(time);
      messagesEl.appendChild(div);
      return bubble;
    }

    // Menambahkan bubble pesan user (kanan) ke area chat
    function appendUserMsg(text) {
      const div = document.createElement('div');
      div.className = 'msg user';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      const time = document.createElement('span');
      time.className = 'msg-time';
      time.textContent = getTime();
      div.appendChild(bubble);
      div.appendChild(time);
      messagesEl.appendChild(div);
      // Scroll otomatis ke bawah agar pesan terbaru terlihat
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Menampilkan atau menyembunyikan animasi typing (3 titik bergerak)
    function setTyping(show) {
      typingEl.style.display = show ? 'flex' : 'none';
      if (show) messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Menghapus pola citation seperti 【16:2†knowledge.docx】 dari teks bot
    function cleanCitation(text) {
      return text.replace(/【[^】]*】/g, '').replace(/\[\d+:\d+[^\]]*\]/g, '');
    }

    // Mengubah karakter HTML khusus menjadi entitas HTML untuk mencegah XSS
    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // Memformat teks bot: mengubah nomor WA dan link markdown menjadi tag <a> yang bisa diklik
    function formatMessage(text) {
      let out = escapeHtml(text);

      // Ubah format markdown link [label](url) menjadi <a href>
      out = out.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,
        (match, label, url) => '<a href="' + url + '" target="_blank">' + label + '</a>'
      );

      // Ubah nomor WhatsApp Indonesia menjadi link wa.me yang langsung bisa diklik
      out = out.replace(
        /(\+62|62|0)([\s-]?8[\d\s-]{8,11})/g,
        (match) => {
          const clean = match.replace(/[\s-]/g, '').replace(/^0/, '62').replace(/^\+/, '');
          return '<a href="https://wa.me/' + clean + '" target="_blank">' + match + '</a>';
        }
      );

      return out;
    }

    // Memanggil endpoint /start untuk mendapatkan thread_id baru saat halaman pertama dibuka
    async function initThread() {
      try {
        const res = await fetch(`${BACKEND}/start`);
        const data = await res.json();
        threadId = data.thread_id;
      } catch {
        // Jika gagal konek ke backend, set threadId ke 'demo' sebagai fallback
        threadId = 'demo';
      }
    }

    // Fungsi utama: mengirim pesan user ke backend dan menampilkan streaming response dari bot
    async function sendMessage() {
      const text = inputEl.value.trim();

      // Abaikan jika input kosong atau bot masih memproses pesan sebelumnya
      if (!text || isWaiting) return;

      // Sembunyikan chips setelah user mulai mengetik
      chipsEl.style.display = 'none';

      appendUserMsg(text);
      inputEl.value = '';
      inputEl.style.height = 'auto';

      isWaiting = true;
      sendBtn.disabled = true;
      setTyping(true);

      // Tampilkan error jika koneksi ke backend gagal saat init
      if (!threadId || threadId === 'demo') {
        await new Promise(r => setTimeout(r, 900));
        setTyping(false);
        const bubble = createBotBubble();
        bubble.textContent = 'Maaf, tidak dapat terhubung ke server. Pastikan backend sudah berjalan di port 8080.';
        isWaiting = false;
        sendBtn.disabled = false;
        return;
      }

      try {
        // Kirim pesan ke endpoint /chat via POST
        const res = await fetch(`${BACKEND}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ thread_id: threadId, message: text })
        });

        setTyping(false);
        const bubble = createBotBubble();
        bubble.textContent = '';

        // Membaca response streaming (SSE) kata per kata
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          // Decode chunk binary menjadi string, stream: true agar multi-byte char aman
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');

          // Sisakan baris terakhir di buffer jika belum lengkap (belum ada \n)
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6).trim();
            if (data === '[DONE]') break;
            try {
              const parsed = JSON.parse(data);
              if (parsed.text) {
                // Akumulasi teks ke dataset.raw lalu render sebagai HTML
                const raw = (bubble.dataset.raw || '') + cleanCitation(parsed.text);
                bubble.dataset.raw = raw;
                bubble.innerHTML = formatMessage(raw);
                messagesEl.scrollTop = messagesEl.scrollHeight;
              }
            } catch { }
          }
        }

      } catch (err) {
        setTyping(false);
        const bubble = createBotBubble();
        bubble.textContent = 'Koneksi ke server gagal. Pastikan backend sudah berjalan.';
      }

      isWaiting = false;
      sendBtn.disabled = false;
    }

    // Mengisi input dengan teks chip lalu langsung mengirim pesan
    function sendChip(el) {
      inputEl.value = el.textContent;
      sendMessage();
    }

    // Kirim pesan dengan Enter (tanpa Shift), Shift+Enter untuk baris baru
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // Auto-resize textarea sesuai konten, maksimal 100px
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });

    // Inisialisasi thread saat halaman pertama kali dimuat
    initThread();
  </script>
</body>

</html>
