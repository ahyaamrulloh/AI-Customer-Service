<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 370px;
      height: 500px;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
    }

    @media (max-width: 480px) {
      #app {
        width: 100%;
        height: 500px;
        border-radius: 16px;
        box-shadow: none;
      }
    }

    #header {
      padding: 14px 18px;
      border-bottom: 1px solid #e8ddd4;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #4A2C2A;
    }

    #avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #7B4F3A;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    #header-info p {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    #header-info span {
      font-size: 12px;
      color: #c8a882;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #status-dot {
      width: 7px;
      height: 7px;
      background: #4CAF50;
      border-radius: 50%;
      display: inline-block;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #faf6f2;
      scrollbar-width: thin;
    }

    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #d1b8a0; border-radius: 10px; }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }

    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot  { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: #4A2C2A;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.bot .bubble {
      background: #fff;
      border: 1px solid #e8ddd4;
      color: #2c1a10;
      border-bottom-left-radius: 4px;
    }

    /* Link di bubble bot — hanya tag <a> yang boleh ada (hasil sanitizeForDOM) */
    .msg.bot .bubble a {
      color: #25D366;
      text-decoration: underline;
      font-weight: 600;
    }

    .msg-time {
      font-size: 11px;
      color: #a08070;
      margin-top: 4px;
      padding: 0 4px;
    }

    #typing {
      display: none;
      align-self: flex-start;
    }

    #typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 16px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a08070;
      animation: bounce 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }

    #chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 16px;
      background: #faf6f2;
      border-top: 1px solid #e8ddd4;
    }

    .chip {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #c8a882;
      background: #fff;
      color: #7B4F3A;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .chip:hover {
      background: #4A2C2A;
      color: #fff;
      border-color: #4A2C2A;
    }

    #input-area {
      padding: 12px 14px;
      border-top: 1px solid #e8ddd4;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #fff;
    }

    #msg-input {
      flex: 1;
      resize: none;
      border: 1px solid #e8ddd4;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 14px;
      font-family: Arial, sans-serif;
      background: #faf6f2;
      color: #2c1a10;
      outline: none;
      max-height: 100px;
      line-height: 1.4;
    }

    #msg-input:focus { border-color: #7B4F3A; }

    #send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #4A2C2A;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    #send-btn:hover { background: #7B4F3A; }

    #send-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #send-btn:disabled { background: #e8ddd4; cursor: not-allowed; }
    #send-btn:disabled svg { stroke: #a08070; }
  </style>
</head>

<body>
  <div id="app">
    <div id="header">
      <div id="avatar">☕</div>
      <div id="header-info">
        <p>Ai Assistant</p>
        <span><span id="status-dot"></span> online</span>
      </div>
    </div>

    <div id="messages">
      <div class="msg bot">
        <div class="bubble">Halo! Selamat datang di Coffee Nusantara. Ada yang bisa saya bantu?</div>
        <span class="msg-time">Baru saja</span>
      </div>
    </div>

    <div id="typing" class="msg bot">
      <div class="bubble">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div id="chips">
      <div class="chip" onclick="sendChip(this)">Produk apa saja?</div>
      <div class="chip" onclick="sendChip(this)">Cara order</div>
      <div class="chip" onclick="sendChip(this)">Jam operasional</div>
      <div class="chip" onclick="sendChip(this)">Produk halal?</div>
      <div class="chip" onclick="sendChip(this)">Info pengiriman</div>
    </div>

    <div id="input-area">
      <textarea id="msg-input" placeholder="Ketik pesan..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()" aria-label="Kirim">
        <svg viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    // Base URL backend diambil dari origin halaman ini (relatif),
    // sehingga widget.js yang dipasang di domain lain tetap bisa mengarah ke backend yang benar
    const BACKEND = window.location.origin;

    // Referensi DOM yang sering diakses — diambil sekali di awal agar tidak query DOM berulang kali
    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('msg-input');
    const sendBtn    = document.getElementById('send-btn');
    const typingEl   = document.getElementById('typing');
    const chipsEl    = document.getElementById('chips');

    let threadId  = null;  // Menyimpan thread_id aktif untuk sesi percakapan ini
    let isWaiting = false; // Flag untuk mencegah pengiriman pesan ganda saat bot masih merespons

    // ── Helper: waktu sekarang ────────────────────────────────
    // Mengembalikan waktu dalam format HH:MM (Indonesia)
    function getTime() {
      return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    // ── Helper: buat bubble bot kosong ───────────────────────
    // Membuat elemen bubble kosong untuk pesan bot dan langsung menambahkannya ke area chat.
    // Mengembalikan referensi elemen bubble agar teks bisa diisi secara streaming (karakter per karakter).
    function createBotBubble() {
      const div    = document.createElement('div');
      div.className = 'msg bot';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const time   = document.createElement('span');
      time.className = 'msg-time';
      time.textContent = getTime();
      div.appendChild(bubble);
      div.appendChild(time);
      messagesEl.appendChild(div);
      return bubble;
    }

    // ── Helper: tampilkan pesan user ─────────────────────────
    // Menambahkan bubble pesan user (sisi kanan) ke area chat
    function appendUserMsg(text) {
      const div    = document.createElement('div');
      div.className = 'msg user';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text; // textContent aman — tidak parse HTML
      const time   = document.createElement('span');
      time.className = 'msg-time';
      time.textContent = getTime();
      div.appendChild(bubble);
      div.appendChild(time);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight; // Scroll otomatis ke pesan terbaru
    }

    // ── Helper: typing indicator ─────────────────────────────
    // Menampilkan atau menyembunyikan animasi 3 titik bergerak saat bot sedang memproses
    function setTyping(show) {
      typingEl.style.display = show ? 'flex' : 'none';
      if (show) messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ── Helper: bersihkan citation ───────────────────────────
    // Menghapus pola citation seperti 【16:2†knowledge.docx】 yang kadang muncul dari OpenAI
    function cleanCitation(text) {
      return text
        .replace(/【[^】]*】/g, '')       // Format citation OpenAI Assistants API
        .replace(/\[\d+:\d+[^\]]*\]/g, ''); // Format citation alternatif
    }

    // ── Helper: escape HTML ──────────────────────────────────
    // Mengubah karakter HTML khusus menjadi entitas HTML yang aman
    // Ini adalah langkah pertama sebelum teks bot ditampilkan ke DOM
    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Helper: format teks bot ──────────────────────────────
    // Mengubah plain text bot menjadi HTML yang aman:
    // 1. Escape semua karakter HTML terlebih dahulu (mencegah XSS)
    // 2. Ubah markdown link [label](url) → <a href>
    // 3. Ubah nomor WA Indonesia → link wa.me yang bisa diklik
    function formatMessage(text) {
      let out = escapeHtml(text);

      // Ubah format markdown link menjadi tag <a> yang bisa diklik
      out = out.replace(
        /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
        (_, label, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`
      );

      // Ubah nomor WhatsApp Indonesia menjadi link wa.me langsung bisa diklik
      out = out.replace(
        /(\+62|62|0)([\s\-]?8[\d\s\-]{8,11})/g,
        (match) => {
          const clean = match.replace(/[\s\-]/g, '').replace(/^0/, '62').replace(/^\+/, '');
          return `<a href="https://wa.me/${clean}" target="_blank" rel="noopener noreferrer">${match}</a>`;
        }
      );

      return out;
    }

    // ── Helper: sanitasi DOM output ──────────────────────────
    // Lapisan keamanan terakhir sebelum HTML dari formatMessage dimasukkan ke DOM via innerHTML.
    // Fungsi ini hanya mengizinkan tag <a> dengan atribut href dan target yang aman.
    // Semua tag lain (termasuk <script>, <img>, <iframe>) dihapus dan diganti teks biasa.
    // Ini mencegah XSS jika ada teks berbahaya yang lolos dari escapeHtml.
    function sanitizeForDOM(html) {
      const temp = document.createElement('div');
      temp.innerHTML = html; // Parse HTML ke DOM sementara

      // Iterasi semua elemen dalam DOM sementara
      temp.querySelectorAll('*').forEach(el => {
        if (el.tagName === 'A') {
          // Untuk tag <a>: hanya izinkan href yang dimulai dengan https:// atau http://
          const href = el.getAttribute('href') || '';
          if (!href.startsWith('https://') && !href.startsWith('http://')) {
            // Jika href mencurigakan (javascript:, data:, dll) → hapus tag, sisakan teksnya
            el.replaceWith(document.createTextNode(el.textContent));
            return;
          }
          // Hapus semua atribut kecuali href, target, rel — mencegah event handler berbahaya (onclick, onerror, dll)
          [...el.attributes].forEach(attr => {
            if (!['href', 'target', 'rel'].includes(attr.name)) {
              el.removeAttribute(attr.name);
            }
          });
          // Paksa target="_blank" dan rel="noopener noreferrer" untuk keamanan tab baru
          el.setAttribute('target', '_blank');
          el.setAttribute('rel', 'noopener noreferrer');
        } else {
          // Semua tag selain <a> (termasuk <script>, <b>, <img>, dll) → hapus, sisakan teks saja
          el.replaceWith(document.createTextNode(el.textContent));
        }
      });

      return temp.innerHTML;
    }

    // ── Init: buat sesi baru ─────────────────────────────────
    // Memanggil /start saat halaman pertama dibuka untuk mendapatkan thread_id unik.
    // Thread_id ini dikirim bersama setiap pesan agar server tahu percakapan siapa ini.
    async function initThread() {
      try {
        const res  = await fetch(`${BACKEND}/start`);
        const data = await res.json();
        threadId   = data.thread_id;
      } catch {
        // Jika gagal konek ke backend, set 'demo' sebagai tanda error
        // Frontend akan menampilkan pesan error yang ramah
        threadId = 'demo';
      }
    }

    // ── Fungsi utama: kirim pesan ────────────────────────────
    // Alur: validasi input → tampilkan pesan user → kirim ke backend → tampilkan streaming response
    async function sendMessage() {
      const text = inputEl.value.trim();

      // Abaikan jika input kosong atau bot masih memproses pesan sebelumnya
      if (!text || isWaiting) return;

      // Sembunyikan chips setelah user mulai berinteraksi — tidak perlu tampil lagi
      chipsEl.style.display = 'none';

      appendUserMsg(text);
      inputEl.value = '';
      inputEl.style.height = 'auto';

      isWaiting       = true;
      sendBtn.disabled = true;
      setTyping(true);

      // Tampilkan pesan error jika inisialisasi thread gagal
      if (!threadId || threadId === 'demo') {
        await new Promise(r => setTimeout(r, 800));
        setTyping(false);
        const bubble = createBotBubble();
        bubble.textContent = 'Maaf, tidak dapat terhubung ke server. Pastikan backend sudah berjalan.';
        isWaiting       = false;
        sendBtn.disabled = false;
        return;
      }

      try {
        // Kirim pesan ke /chat via HTTP POST
        const res = await fetch(`${BACKEND}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ thread_id: threadId, message: text })
        });

        setTyping(false);
        const bubble   = createBotBubble();
        bubble.textContent = '';

        // ── Baca SSE stream ──────────────────────────────────
        // Response dari server adalah stream SSE yang dikirim potongan demi potongan.
        // Kita baca menggunakan ReadableStream API agar teks muncul real-time.
        const reader  = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer    = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          // Decode bytes → string, stream: true agar karakter multi-byte (emoji, dll) tidak terpotong
          buffer += decoder.decode(value, { stream: true });

          // SSE menggunakan "\n" sebagai pemisah event — split dan proses per baris
          const lines = buffer.split('\n');

          // Baris terakhir mungkin belum lengkap (belum ada \n di akhir) — simpan ke buffer
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue; // Abaikan baris non-data SSE

            const data = line.slice(6).trim(); // Ambil konten setelah "data: "
            if (data === '[DONE]') break;       // Sinyal stream selesai dari server

            try {
              const parsed = JSON.parse(data);
              if (parsed.text) {
                // Akumulasi teks mentah di dataset.raw agar format ulang saat teks bertambah
                const raw = (bubble.dataset.raw || '') + cleanCitation(parsed.text);
                bubble.dataset.raw = raw;
                // Render HTML yang sudah diformat DAN disanitasi ke DOM
                bubble.innerHTML = sanitizeForDOM(formatMessage(raw));
                messagesEl.scrollTop = messagesEl.scrollHeight; // Scroll ke teks terbaru
              }
            } catch { /* Abaikan chunk JSON yang corrupt */ }
          }
        }

      } catch {
        // Tangkap error jaringan (offline, server down, dll)
        setTyping(false);
        const bubble = createBotBubble();
        bubble.textContent = 'Koneksi ke server gagal. Pastikan backend sudah berjalan.';
      }

      isWaiting       = false;
      sendBtn.disabled = false;
    }

    // ── Chip: kirim pesan dari tombol cepat ─────────────────
    // Mengisi input dengan teks chip lalu langsung mengirim pesan
    function sendChip(el) {
      inputEl.value = el.textContent;
      sendMessage();
    }

    // ── Event: Enter untuk kirim, Shift+Enter untuk baris baru ──
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault(); // Cegah newline default dari Enter
        sendMessage();
      }
    });

    // ── Event: auto-resize textarea sesuai konten ────────────
    // Textarea akan membesar saat user mengetik banyak, maksimal 100px
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    });

    // ── Bootstrap: inisialisasi thread saat halaman dimuat ───
    initThread();
  </script>
</body>

</html>
